# Security as code sobre /terraform y sobre las políticas de Kyverno.
#
# El Terraform de este repo describe el camino en GCP (Cloud Run + Binary
# Authorization) y NO se aplica en el demo: se valida y se escanea. Eso
# igual tiene valor, porque `fmt`, `validate`, Checkov y tfsec corren sin
# credenciales de GCP y encuentran lo que un `apply` encontraría tarde.

name: iac-scan

on:
  push:
    branches: [main]
    paths: ["terraform/**", "policy/**", ".github/workflows/iac-scan.yml"]
  pull_request:
    branches: [main]
    paths: ["terraform/**", "policy/**", ".github/workflows/iac-scan.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=terraform fmt -check -recursive -diff
      # -backend=false: para validar hacen falta los providers, no el state.
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --no-cache-dir "checkov>=3.2,<4"

      # continue-on-error acá y un paso explícito de falla al final. Son dos
      # cosas distintas que antes estaban mezcladas: que Checkov encuentre
      # findings (y por eso salga distinto de cero) no debería impedir que su
      # reporte se suba. Sin esta separación, el hallazgo se pierde justo
      # cuando más se necesita verlo.
      - name: Run Checkov
        id: checkov
        continue-on-error: true
        run: |
          # --output-file-path espera un DIRECTORIO para las salidas a archivo;
          # checkov escribe results_sarif.sarif adentro.
          #
          # No uso --soft-fail-on por severidad: las severidades vienen de la
          # plataforma de Prisma Cloud, así que sin API key no matchean nada y
          # el flag daría una falsa sensación de umbral. Las excepciones son
          # --skip-check explícitos, revisables en un PR:
          #
          #   CKV_GCP_43  rotación de clave KMS: GCP no soporta rotación
          #               automática en claves ASYMMETRIC_SIGN, y rotar la del
          #               attestor invalida las attestations ya emitidas.
          #   CKV_GCP_84  Artifact Registry con CMEK: no aplica a un registry
          #               de imágenes públicas de demo.
          mkdir -p checkov-out
          checkov \
            --directory terraform \
            --framework terraform \
            --skip-check CKV_GCP_43,CKV_GCP_84 \
            --output cli --output sarif \
            --output-file-path console,checkov-out \
            --compact

      - name: Qué archivos dejó Checkov
        if: always()
        run: ls -la checkov-out || echo "checkov-out no existe"

      # El upload solo corre si el SARIF existe de verdad. Antes fallaba con
      # "Path does not exist" y ese error tapaba el resultado real del scan.
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('checkov-out/results_sarif.sarif') != ''
        with:
          sarif_file: checkov-out/results_sarif.sarif
          category: checkov

      - name: El gate de IaC falla si Checkov encontró algo
        if: steps.checkov.outcome == 'failure'
        run: |
          echo "Checkov encontró incumplimientos de política. El detalle está arriba, en 'Run Checkov'."
          exit 1

  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          working_directory: terraform
          sarif_file: tfsec.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: tfsec.sarif
          category: tfsec
