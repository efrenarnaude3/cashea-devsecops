# CodeQL en su propio workflow porque tiene otro modelo de disparo: además de
# push y PR corre semanal, para que un hallazgo de una query nueva aparezca
# aunque nadie haya tocado el repo en un mes.
#
# TypeScript no necesita compilarse para CodeQL, así que build-mode es none.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
