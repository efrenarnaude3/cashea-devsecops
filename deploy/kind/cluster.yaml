# Clúster local de un nodo. Alcanza: lo que se demuestra acá es el control de
# admisión, no la topología.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: heimdall
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Para poder curlear el servicio desde la máquina sin port-forward.
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
