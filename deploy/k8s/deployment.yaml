# Deployment del servicio, endurecido para pasar el perfil `restricted` de Pod
# Security Admission: non-root, sin escalada de privilegios, sin capabilities,
# filesystem de solo lectura y seccomp por defecto.
#
# La imagen es __IMAGE__ y la reemplaza el script del demo con la referencia
# real. Kyverno, además, reescribe el tag al digest verificado en el momento de
# admitir el Pod (mutateDigest), así que lo que termina corriendo está pinneado
# a un digest inmutable aunque el manifiesto diga un tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes-api
  labels:
    app: notes-api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # 'nonroot' en la imagen distroless
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notes-api
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          envFrom:
            - secretRef:
                name: notes-api-secrets
                # optional: el Pod arranca sin el Secret y la app falla cerrada
                # (503 en el endpoint de escritura) en vez de quedar arriba sin
                # autenticación. El valor real se crea aparte, nunca acá.
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            # Con readOnlyRootFilesystem, /tmp tiene que ser un volumen
            # explícito. Nada más del filesystem es escribible.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
